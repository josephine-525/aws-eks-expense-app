# EKS: same empty API_BASE as ECS (browser calls same origin). Proxy API paths to the
# backend Service in-cluster — two LoadBalancers otherwise leave /expenses on nginx only.
#
# Upstream is "team-payments-backend-common-web-service:80" — the common-web-service chart's
# generated Service name (release name + chart name), port 80 (the chart's Service always
# listens on 80 regardless of the container's own targetPort). This used to be the old
# hand-written "expense-backend:8080" Service from k8s/eks-workload.yaml, which no longer
# exists under the new chart-based deploy — left stale here until this pod actually crashed
# on it (nginx: "host not found in upstream"). Known coupling: this bakes team-payments'
# specific release name into the image, so it only works for that one release — fine while
# expenseapp is the only frontend+backend pair in this cluster, but not reusable as-is if a
# second team ever needed this same frontend image under a different release name.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    location /expenses {
        proxy_pass http://team-payments-backend-common-web-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /months {
        proxy_pass http://team-payments-backend-common-web-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /summary {
        proxy_pass http://team-payments-backend-common-web-service:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scraped by the nginx-exporter sidecar over localhost only (Prometheus never
    # talks to this directly — it hits the sidecar's :9113/metrics instead).
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        try_files $uri /index.html;
    }
}
